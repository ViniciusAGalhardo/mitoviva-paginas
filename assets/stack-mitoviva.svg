<svg xmlns="http://www.w3.org/2000/svg" width="720" height="440" viewBox="0 0 720 440" role="img" aria-label="Protocolo Encendido 30: programa, app y bonos">
  <defs>
    <linearGradient id="cov" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B4A"/><stop offset="1" stop-color="#FF8A00"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2B2B"/><stop offset="1" stop-color="#0E0E0E"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".6" r=".6"><stop offset="0" stop-color="#FF6B4A" stop-opacity=".35"/><stop offset="1" stop-color="#FF6B4A" stop-opacity="0"/></radialGradient>
    <g id="mito"><rect x="-26" y="-14" width="52" height="28" rx="14" fill="none" stroke="#fff" stroke-width="5"/><path d="M-17 0 C-14 -9 -10 -9 -8 0 S-3 9 0 0 S6 -9 8 0 S14 9 17 0" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g>
  </defs>
  <ellipse cx="360" cy="300" rx="340" ry="150" fill="url(#glow)"/>
  <!-- Caixa do programa (fundo) -->
  <g transform="translate(250 30)">
    <rect width="190" height="250" rx="6" fill="url(#dark)" stroke="#3a3a3a"/>
    <rect x="190" y="8" width="22" height="242" fill="#1a1a1a"/>
    <rect x="14" y="14" width="162" height="120" rx="4" fill="url(#cov)"/>
    <use href="#mito" transform="translate(95 70) scale(1.4)"/>
    <text x="95" y="160" fill="#fff" font-family="Poppins, Arial" font-size="15" font-weight="600" text-anchor="middle">Protocolo</text>
    <text x="95" y="186" fill="#FF8A00" font-family="Poppins, Arial" font-size="22" font-weight="800" text-anchor="middle">ENCENDIDO 30</text>
  </g>
  <!-- Bônus (caixas menores) -->
  <g transform="translate(70 150)">
    <rect width="150" height="200" rx="6" fill="url(#dark)" stroke="#3a3a3a"/>
    <rect x="12" y="12" width="126" height="110" rx="4" fill="#2EC4A6"/>
    <text x="75" y="75" fill="#fff" font-family="Poppins, Arial" font-size="40" text-anchor="middle">🛒</text>
    <text x="75" y="152" fill="#fff" font-family="Poppins, Arial" font-size="15" font-weight="600" text-anchor="middle">Lista de</text>
    <text x="75" y="172" fill="#FF8A00" font-family="Poppins, Arial" font-size="13" font-weight="600" text-anchor="middle">Mercado Inteligente</text>
  </g>
  <g transform="translate(500 150)">
    <rect width="150" height="200" rx="6" fill="url(#dark)" stroke="#3a3a3a"/>
    <rect x="12" y="12" width="126" height="110" rx="4" fill="#FFA62B"/>
    <text x="75" y="78" fill="#fff" font-family="Poppins, Arial" font-size="40" text-anchor="middle">🍬</text>
    <text x="75" y="152" fill="#fff" font-family="Poppins, Arial" font-size="15" font-weight="600" text-anchor="middle">Protocolo</text>
    <text x="75" y="172" fill="#FF8A00" font-family="Poppins, Arial" font-size="13" font-weight="600" text-anchor="middle">Adiós Azúcar</text>
  </g>
  <!-- Notebook -->
  <g transform="translate(220 240)">
    <rect width="250" height="150" rx="8" fill="#111" stroke="#444" stroke-width="3"/>
    <rect x="10" y="10" width="230" height="130" rx="3" fill="url(#cov)"/>
    <use href="#mito" transform="translate(125 62) scale(1.3)"/>
    <text x="125" y="118" fill="#fff" font-family="Poppins, Arial" font-size="20" font-weight="600" text-anchor="middle">mitoviva</text>
    <path d="M-20 150 H270 L255 166 H-5 Z" fill="#2a2a2a"/>
  </g>
  <!-- Celular -->
  <g transform="translate(445 215)">
    <rect width="96" height="190" rx="16" fill="#111" stroke="#444" stroke-width="3"/>
    <rect x="7" y="12" width="82" height="166" rx="10" fill="#FFF7F0"/>
    <rect x="15" y="24" width="66" height="10" rx="5" fill="#FF6B4A"/>
    <rect x="15" y="42" width="66" height="40" rx="6" fill="#fff" stroke="#F1E4D8"/>
    <rect x="15" y="90" width="66" height="8" rx="4" fill="#2EC4A6"/>
    <rect x="15" y="104" width="50" height="8" rx="4" fill="#F1E4D8"/>
    <rect x="15" y="118" width="58" height="8" rx="4" fill="#F1E4D8"/>
    <rect x="15" y="132" width="44" height="8" rx="4" fill="#F1E4D8"/>
  </g>
</svg>
